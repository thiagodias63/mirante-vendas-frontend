<main
	class="dashboard page-shell"
	aria-labelledby="dashboard-title">
	<h1
		id="dashboard-title"
		class="dashboard__title">
		Dashboard de vendas
	</h1>
		<p class="dashboard__description">A tabela agrupa quantidade e pre&ccedil;o por produto e dia; o gr&aacute;fico mostra a quantidade vendida em cada data.</p>

	<p
		*ngIf="(dashboardState.state$ | async)?.errorMessage as errorMessage"
		class="dashboard__error"
		role="alert">
		{{ errorMessage }}
	</p>

	<app-sales-table (productSelected)="showDetails($event)"></app-sales-table>

	<app-sales-chart></app-sales-chart>
</main>

<app-product-details-dialog
	[(visible)]="detailsVisible"
	[product]="selectedProduct"></app-product-details-dialog>
