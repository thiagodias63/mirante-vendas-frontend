<main
	class="dashboard page-shell"
	aria-labelledby="dashboard-title">
	<h1
		id="dashboard-title"
		class="dashboard__title">
		Dashboard de vendas
	</h1>
	<p class="dashboard__description">
		A tabela agrupa quantidade e pre&ccedil;o por produto e dia; o gr&aacute;fico soma a quantidade vendida por produto.
	</p>

	<p
		*ngIf="(dashboardState.state$ | async)?.errorMessage as errorMessage"
		class="dashboard__error"
		role="alert">
		{{ errorMessage }}
	</p>

	<div class="dashboard__view-controls">
		<p-selectButton
			[options]="viewModes"
			[(ngModel)]="viewMode"
			optionLabel="label"
			optionValue="value"
			aria-label="Modo de visualização"></p-selectButton>
		<app-sales-export-button></app-sales-export-button>
	</div>

	<app-sales-table
		*ngIf="viewMode === 'table'"
		(productSelected)="showDetails($event)"></app-sales-table>
	<app-sales-chart *ngIf="viewMode === 'chart'"></app-sales-chart>
</main>

<app-product-details-dialog></app-product-details-dialog>
