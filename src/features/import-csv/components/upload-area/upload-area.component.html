<div class="upload-area" [class.is-loading]="loading">
  <div class="upload-area__icon">
    <i class="pi pi-file" aria-hidden="true"></i>
  </div>
  <h2 class="upload-area__title">Arquivo de vendas</h2>
  <p class="upload-area__description">
    Selecione um arquivo CSV com os dados de vendas.
  </p>
  <p-fileUpload
    mode="basic"
    name="csv"
    accept=".csv,text/csv"
    chooseLabel="Selecionar arquivo"
    chooseIcon="pi pi-folder-open"
    [auto]="false"
    [disabled]="loading || sending"
    (onSelect)="onFileSelect($event)"
  >
  </p-fileUpload>
  <div *ngIf="selectedFile" class="upload-area__file-name">
    <i class="pi pi-paperclip upload-area__file-name-icon"></i
    >{{ selectedFile.name }}
  </div>
  <div *ngIf="!selectedFile" class="upload-area__file-hint">
    Formato aceito: .csv
  </div>

  <button
    *ngIf="!loading && !sending"
    pButton
    type="button"
    class="upload-area__submit-button"
    label="Processar arquivo"
    icon="pi pi-upload"
    [disabled]="!selectedFile"
    [loading]="loading"
    (click)="submit()"
  ></button>

  <app-processing-state
    [loading]="loading"
    [sending]="sending"
  ></app-processing-state>
</div>
