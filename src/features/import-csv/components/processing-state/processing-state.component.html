<div class="processing-state" *ngIf="loading || sending" aria-live="polite">
  <p-skeleton width="12rem" height="1rem"></p-skeleton>
  <p-skeleton width="100%" height="0.65rem"></p-skeleton>
  <span>{{
    sending
      ? "Enviando vendas ao backend…"
      : "Validando e processando seu arquivo…"
  }}</span>
</div>
