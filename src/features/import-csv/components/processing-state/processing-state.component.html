<div *ngIf="loading || sending" class="processing-state" aria-live="polite">
  <p-progressBar
    mode="indeterminate"
    [style]="{ height: '3.125rem' }"
  ></p-progressBar>
  <span>{{
    sending
      ? "Enviando vendas ao backend…"
      : "Validando e processando seu arquivo…"
  }}</span>
</div>
