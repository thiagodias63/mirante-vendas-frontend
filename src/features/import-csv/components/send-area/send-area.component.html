<section
  class="send-area"
  *ngIf="processedSales.length"
  aria-labelledby="send-title"
>
  <div class="send-heading">
    <div>
      <h2 id="send-title">Enviar vendas ao backend</h2>
      <p>{{ processedSales.length }} vendas validadas</p>
    </div>
    <i class="pi pi-cloud-upload" aria-hidden="true"></i>
  </div>
  <label>Estratégia de envio</label>
  <p-selectButton
    [options]="processModes"
    optionLabel="label"
    optionValue="value"
    [(ngModel)]="processMode"
    [disabled]="sending"
    styleClass="strategy-select"
  ></p-selectButton>
  <div class="send-area__buttons-wrapper">
    <button
      pButton
      type="button"
      class="send-button p-button-secondary"
      label="Voltar"
      icon="pi pi-back"
      [disabled]="sending || loading"
      [loading]="sending"
      (click)="goBack()"
    ></button>
    <button
      pButton
      type="button"
      class="submit-button send-button"
      label="Enviar vendas"
      icon="pi pi-send"
      [disabled]="sending || loading"
      [loading]="sending"
      (click)="sendSales()"
    ></button>
  </div>
</section>
