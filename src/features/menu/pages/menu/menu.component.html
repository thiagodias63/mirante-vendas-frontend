<p-toolbar class="app-header">
	<ng-template pTemplate="start">
		<a class="app-header__brand" routerLink="/dashboard" aria-label="Mirante Vendas - dashboard">
			<i class="pi pi-chart-line" aria-hidden="true"></i>
			<span>Mirante Vendas</span>
		</a>
	</ng-template>
	<ng-template pTemplate="end">
		<p-menubar class="app-header__menubar" [model]="items" aria-label="Navegação principal"></p-menubar>
	</ng-template>
</p-toolbar>
